version: '3.8'

services:
  cuanly-postgres:
    image: postgres:16-alpine
    container_name: cuanly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cuanly_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cuanly_pgdata:/var/lib/postgresql/data
      - ./migrations/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./seeds/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cuanly_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  cuanly-adminer:
    image: adminer:latest
    container_name: cuanly-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - cuanly-postgres

volumes:
  cuanly_pgdata:
    driver: local
